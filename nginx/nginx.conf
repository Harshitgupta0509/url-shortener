events {}

http {
  upstream india {
    server app-india:3000;
    server app-us:3000 backup;
  }

  upstream us {
    server app-us:3000;
    server app-india:3000 backup;
  }

  map $http_x_region $target_region {
    default india;
    us us;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://$target_region;
      proxy_set_header Host $host;
      proxy_connect_timeout 1s;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 2;
    }
  }
}
